name = "daily-reminder"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 定时触发（cron 用 UTC；北京时间 = UTC + 8）
# "0 0 * * *"        -> 北京 08:00  雅思任务 + 自我鼓励
# "1 1 * * *"        -> 北京 09:01  微目标
# "*/30 13-16 * * *" -> 北京 21:00-24:00 每半小时（代码里只认 21:00-23:30 与 00:00，
#                       16:30 UTC 那次会被自动跳过，所以实际 7 次）
[triggers]
crons = ["0 0 * * *", "1 1 * * *", "*/30 13-16 * * *"]

# 注意：PPTOKEN 不要写在这里，用命令行 `wrangler secret put PPTOKEN` 设置。
